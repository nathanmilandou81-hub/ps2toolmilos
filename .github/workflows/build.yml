name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Clean old buildozer cache
        run: rm -rf .buildozer bin

      - name: Build APK
        env:
          PIP_CONSTRAINT: /home/runner/work/ps2toolmilos/ps2toolmilos/constraints.txt
        run: |
          echo "charset_normalizer<3.5.1" > constraints.txt
          yes | buildozer -v android debug 2>&1 | tee build_output.log

      - name: Show last log lines on failure
        if: failure()
        run: |
          echo "===== DERNIERES 200 LIGNES ====="
          tail -n 200 build_output.log
          echo "===== FIN DU LOG ====="

      - name: List generated files (debug)
        run: |
          echo "=== Contenu de bin/ ==="
          find . -name '*.apk' -o -name 'bin' -type d 2>/dev/null
          ls -la bin/ 2>/dev/null || echo "Pas de dossier bin/"
          echo "=== Dernieres 100 lignes du build ==="
          tail -n 100 build_output.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps2toolmilos-apk
          path: |
            bin/*.apk
            **/bin/*.apk
          if-no-files-found: warn
