name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Clean old buildozer cache
        run: buildozer android clean || true

      - name: Build APK
        run: buildozer -v android debug

      - name: List generated files (debug)
        if: always()
        run: |
          echo "=== Contenu de bin/ ==="
          find . -name '*.apk' -o -name 'bin' -type d
          ls -la bin/ 2>/dev/null || echo "Pas de dossier bin/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps2toolmilos-apk
          path: bin/*.apk
          if-no-files-found: warn
